<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Frenkli Zeqollari is a software engineer in Berlin building AI-powered mobile and web products."/>
  <meta name="robots" content="index, follow"/>
  <meta name="theme-color" content="#0f1f3d"/>
  <link rel="canonical" href="https://frenkli-portfolio.vercel.app/"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Frenkli Zeqollari - Software Engineer"/>
  <meta property="og:description" content="Portfolio of Frenkli Zeqollari: software engineering, AI-powered products, and digital experiences."/>
  <meta property="og:url" content="https://frenkli-portfolio.vercel.app/"/>
  <meta property="og:image" content="https://frenkli-portfolio.vercel.app/frenkli.jpg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Frenkli Zeqollari - Software Engineer"/>
  <meta name="twitter:description" content="Portfolio of Frenkli Zeqollari with projects, experience, and contact details."/>
  <meta name="twitter:image" content="https://frenkli-portfolio.vercel.app/frenkli.jpg"/>
  <title>Frenkli Zeqollari — Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#0f1f3d; --navy2:#1a3260; --cream:#f8f5ef; --cream2:#efe9df;
      --white:#ffffff; --accent:#2563ff; --coral:#e85d3a;
      --text:#dde4f0; --muted:#7a8fb0; --border:rgba(255,255,255,0.09); --radius:20px;
      --bg:#0a1628; --bg2:#0d1b33; --card:#111e3a;
      --fh:'Plus Jakarta Sans',sans-serif; --fb:'Plus Jakarta Sans',sans-serif; --fm:'JetBrains Mono',monospace;
    }
    html { scroll-behavior: smooth; }
    body { background:var(--bg); color:var(--text); font-family:var(--fb); font-size:16px; line-height:1.7; overflow-x:hidden; }

    /* NAV */
    nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1.1rem 2.5rem; background:rgba(10,22,40,0.95); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.07); }
    .nav-logo { font-family:var(--fh); font-weight:800; font-size:1.1rem; color:var(--text); text-decoration:none; letter-spacing:-0.03em; }
    .nav-logo span { color:var(--accent); }
    .nav-right { display:flex; align-items:center; gap:0.5rem; }
    .nav-links { display:flex; gap:0.25rem; list-style:none; }
    .nav-links a { font-family:var(--fb); font-size:0.82rem; font-weight:500; color:var(--muted); text-decoration:none; padding:0.5rem 0.9rem; border-radius:50px; transition:background 0.18s,color 0.18s; }
    .nav-links a:hover { background:rgba(255,255,255,0.08); color:var(--text); }
    .nav-cta { background:var(--navy)!important; color:var(--cream)!important; padding:0.45rem 1.1rem!important; border-radius:50px!important; }
    .nav-cta:hover { background:var(--accent)!important; }
    .lang-toggle { display:flex; align-items:center; background:rgba(255,255,255,0.06); border-radius:50px; padding:3px; border:1px solid rgba(255,255,255,0.08); margin-left:0.5rem; }
    .lang-btn { font-family:var(--fm); font-size:0.65rem; font-weight:500; padding:0.3rem 0.7rem; border-radius:50px; border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all 0.15s; letter-spacing:0.04em; min-height:32px; min-width:36px; }
    .lang-btn.active { background:var(--navy); color:var(--cream); }

    /* HERO */
    #hero { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:4rem; padding:7rem 2.5rem 0; position:relative; overflow:hidden; }
    .hero-blob { position:absolute; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; }
    .blob-1 { width:500px; height:500px; background:rgba(37,99,255,0.12); top:-100px; right:-80px; }
    .blob-2 { width:300px; height:300px; background:rgba(232,93,58,0.09); bottom:80px; left:20px; }
    .hero-left { position:relative; z-index:1; }
    .hero-right { position:relative; z-index:1; display:flex; justify-content:flex-end; }

    .hero-eyebrow { display:inline-flex; align-items:center; gap:0.5rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:50px; padding:0.35rem 1rem; font-family:var(--fm); font-size:0.68rem; font-weight:500; color:var(--accent); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:1.75rem; }
    .eyebrow-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.5)} }

    .hero-name { font-family:var(--fh); font-weight:800; font-size:clamp(2.8rem,6vw,5.5rem); line-height:1.05; letter-spacing:-0.04em; color:var(--text); margin-bottom:1.25rem; }
    .hero-name em { font-style:normal; color:var(--accent); }
    .hero-desc { font-size:1.05rem; color:var(--muted); font-weight:400; max-width:460px; margin-bottom:2.25rem; line-height:1.75; }
    .hero-desc strong { color:var(--text); font-weight:600; }
    .hero-ctas { display:flex; gap:0.85rem; flex-wrap:wrap; }

    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.75rem 1.75rem; border-radius:50px; font-family:var(--fb); font-size:0.88rem; font-weight:600; text-decoration:none; transition:all 0.15s; cursor:pointer; border:none; letter-spacing:-0.01em; }
    .btn-primary { background:var(--navy); color:var(--cream); }
    .btn-primary:hover { background:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(37,99,255,0.25); }
    .btn-ghost { background:transparent; border:1.5px solid rgba(255,255,255,0.15); color:var(--text); }
    .btn-ghost:hover { border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:var(--text); transform:translateY(-2px); }
    .hcard-pills { display:flex; gap:0.4rem; }
    .about-cta { margin-top:1.25rem; }
    .form-submit { align-self:flex-start; min-height:44px; }

    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline:3px solid rgba(37,99,255,0.45);
      outline-offset:2px;
    }

    /* BENTO GRID (hero) */
    .bento-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.75rem; width:100%; max-width:400px; }
    .bento-cell { background:var(--card); border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius); padding:1.25rem 1.4rem; display:flex; flex-direction:column; gap:0.5rem; transition:box-shadow 0.18s,transform 0.18s; }
    .bento-cell:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(15,31,61,0.09); }
    .bento-name { grid-column:1/-1; flex-direction:row; align-items:center; gap:1rem; padding:1.4rem; }
    .bento-avatar { width:46px; height:46px; border-radius:50%; background:var(--navy); color:var(--cream); display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-weight:800; font-size:0.9rem; letter-spacing:-0.02em; flex-shrink:0; object-fit:cover; }
    .bento-fullname { font-family:var(--fh); font-weight:700; font-size:0.95rem; color:var(--text); letter-spacing:-0.02em; }
    .bento-role { font-size:0.74rem; color:var(--muted); }
    .bento-status { background:rgba(16,185,129,0.04); border-color:rgba(16,185,129,0.15); }
    .bento-builds { grid-column:1/-1; flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; }
    .bento-pills { display:flex; gap:0.45rem; flex-wrap:wrap; }
    .bento-langs { grid-row:span 2; background:rgba(37,99,255,0.18); border-color:rgba(37,99,255,0.25); }
    .bento-langs .bento-label { color:rgba(248,245,239,0.45); }
    .bento-langs .bento-value { color:var(--cream); font-family:var(--fm); font-size:1.1rem; font-weight:500; }
    .bento-langs:hover { box-shadow:0 8px 28px rgba(15,31,61,0.2); }
    .bento-sublang { font-family:var(--fm); font-size:0.62rem; color:rgba(248,245,239,0.4); letter-spacing:0.06em; margin-top:auto; }
    .bento-label { font-family:var(--fm); font-size:0.63rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
    .bento-value { font-family:var(--fm); font-size:0.82rem; font-weight:500; color:var(--text); }
    .pill { display:inline-block; padding:0.2rem 0.7rem; border-radius:50px; font-family:var(--fm); font-size:0.67rem; font-weight:500; }
    .pill-blue  { background:rgba(37,99,255,0.1); color:var(--accent); }
    .pill-green { background:rgba(16,185,129,0.1); color:#059669; }
    .pill-navy  { background:var(--navy); color:var(--cream); }

    /* MARQUEE */
    .marquee-wrap { width:100%; overflow:hidden; padding:2rem 0 0; position:relative; z-index:1; grid-column:1/-1; mask-image:linear-gradient(90deg,transparent,black 10%,black 90%,transparent); }
    .marquee-track { display:flex; gap:1.5rem; width:max-content; animation:marquee 28s linear infinite; }
    .marquee-track:hover { animation-play-state:paused; }
    @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    .marquee-item { display:flex; align-items:center; gap:0.5rem; background:var(--card); border:1px solid rgba(255,255,255,0.07); border-radius:50px; padding:0.45rem 1.1rem; font-family:var(--fm); font-size:0.72rem; color:var(--muted); white-space:nowrap; flex-shrink:0; }
    .marquee-item span { font-size:0.85rem; }

    /* SECTIONS */
    section { padding:6rem 2.5rem; }
    .section-inner { max-width:1080px; margin:0 auto; }
    .section-label { font-family:var(--fm); font-size:0.68rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:0.6rem; }
    .section-heading { font-family:var(--fh); font-weight:800; font-size:clamp(2.2rem,4.5vw,3.5rem); letter-spacing:-0.05em; line-height:1.05; color:var(--text); margin-bottom:3.5rem; }

    /* ABOUT */
    #about { background:var(--bg2); }
    .about-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:6rem; align-items:start; }
    .about-text p { color:var(--muted); margin-bottom:1.4rem; font-size:1.02rem; line-height:1.8; }
    .about-text p strong { color:var(--text); font-weight:600; }
    .about-text p em { color:var(--accent); font-style:normal; font-weight:600; }
    .about-aside { display:flex; flex-direction:column; gap:1.25rem; }
    .aside-card { background:var(--card); border-radius:var(--radius); padding:1.75rem; border:1px solid rgba(255,255,255,0.07); }
    .aside-title { font-family:var(--fm); font-size:0.65rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem; }
    .lang-row { display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid rgba(255,255,255,0.07); }
    .lang-row:last-child { border-bottom:none; }
    .lang-name { font-size:0.88rem; font-weight:500; color:var(--text); }
    .lang-lvl { font-family:var(--fm); font-size:0.67rem; color:var(--muted); }
    .pills-wrap { display:flex; flex-wrap:wrap; gap:0.45rem; }

    /* EXPERIENCE */
    #experience { background:var(--bg); }
    .exp-section-title { font-family:var(--fh); font-weight:700; font-size:1rem; color:var(--text); letter-spacing:-0.02em; margin-bottom:1.5rem; margin-top:2.5rem; display:flex; align-items:center; gap:0.75rem; }
    .exp-section-title:first-child { margin-top:0; }
    .exp-section-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.09); }
    .exp-list { display:flex; flex-direction:column; }
    .exp-item { display:grid; grid-template-columns:180px 1fr; gap:2.5rem; padding:2rem 0; border-bottom:1px solid rgba(255,255,255,0.07); }
    .exp-item:last-child { border-bottom:none; }
    .exp-period { font-family:var(--fm); font-size:0.7rem; color:var(--accent); margin-bottom:0.25rem; }
    .exp-loc { font-family:var(--fm); font-size:0.67rem; color:var(--muted); }
    .exp-company { font-family:var(--fh); font-weight:700; font-size:1.1rem; color:var(--text); margin-bottom:0.2rem; letter-spacing:-0.02em; }
    .exp-role { font-size:0.78rem; font-weight:500; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:0.85rem; }
    .exp-bullets { list-style:none; display:flex; flex-direction:column; gap:0.35rem; }
    .exp-bullets li { font-size:0.9rem; color:var(--muted); padding-left:1.1rem; position:relative; }
    .exp-bullets li::before { content:'↳'; position:absolute; left:0; color:var(--navy2); font-size:0.78rem; }

    /* SKILLS */
    #skills { background:var(--bg2); }
    .skills-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
    .skill-card { background:var(--card); border-radius:var(--radius); padding:2rem; border:1px solid rgba(255,255,255,0.07); border-left:3px solid transparent; transition:transform 0.18s,box-shadow 0.18s,border-left-color 0.18s; }
    .skill-card:hover { transform:translateY(-5px); box-shadow:0 12px 40px rgba(0,0,0,0.3); border-left-color:var(--accent); }
    .skill-card-title { font-family:var(--fh); font-weight:700; font-size:0.95rem; color:var(--text); margin-bottom:1rem; letter-spacing:-0.02em; display:flex; align-items:center; gap:0.6rem; }
    .tag-wrap { display:flex; flex-wrap:wrap; gap:0.45rem; }
    .tag { font-family:var(--fm); font-size:0.67rem; font-weight:500; padding:0.28rem 0.75rem; border-radius:50px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.09); color:var(--muted); }

    /* PROJECTS */
    #projects { background:var(--bg); }
    #projects .section-label { color:rgba(221,228,240,0.4); }
    #projects .section-heading { color:var(--text); }
    .proj-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:1.25rem; }
    .proj-card { grid-column:span 4; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius); padding:2.25rem; display:flex; flex-direction:column; transition:background 0.18s,transform 0.18s,border-color 0.18s; }
    .proj-card:hover { background:rgba(255,255,255,0.08); transform:translateY(-4px); border-color:rgba(255,255,255,0.18); }
    .proj-card:nth-child(1),.proj-card:nth-child(2) { grid-column:span 6; }
    .proj-card:nth-child(1) .proj-title,.proj-card:nth-child(2) .proj-title { font-size:1.5rem; }
    .proj-num { font-family:var(--fm); font-size:0.65rem; color:rgba(248,245,239,0.3); letter-spacing:0.1em; margin-bottom:1rem; }
    .proj-title { font-family:var(--fh); font-weight:700; font-size:1.25rem; color:var(--cream); margin-bottom:0.25rem; letter-spacing:-0.03em; }
    .proj-sub { font-family:var(--fm); font-size:0.67rem; color:rgba(248,245,239,0.4); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.9rem; }
    .proj-desc { font-size:0.88rem; color:rgba(248,245,239,0.6); margin-bottom:1.5rem; flex:1; line-height:1.7; }
    .proj-tags { display:flex; flex-wrap:wrap; gap:0.4rem; }
    .proj-tag { font-family:var(--fm); font-size:0.64rem; padding:0.25rem 0.7rem; border-radius:50px; border:1px solid rgba(255,255,255,0.15); color:rgba(248,245,239,0.5); }
    .proj-link {
      display:inline-flex;
      align-items:center;
      gap:0.4rem;
      margin-top:1rem;
      font-family:var(--fm);
      font-size:0.7rem;
      color:rgba(248,245,239,0.5);
      text-decoration:none;
      border:1px solid rgba(255,255,255,0.15);
      border-radius:50px;
      padding:0.3rem 0.8rem;
      transition:color 0.15s,border-color 0.15s;
    }
    .proj-link:hover { color:rgba(248,245,239,0.9); border-color:rgba(255,255,255,0.4); }

    /* EDUCATION */
    #education { background:var(--bg); }
    .edu-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
    .edu-card { background:var(--card); border-radius:var(--radius); padding:2rem; border:1px solid rgba(255,255,255,0.07); transition:transform 0.15s,box-shadow 0.15s; }
    .edu-card:first-child { border-top:3px solid var(--accent); }
    .edu-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,0.3); }
    .edu-period { font-family:var(--fm); font-size:0.68rem; color:var(--accent); margin-bottom:0.5rem; }
    .edu-school { font-family:var(--fh); font-weight:700; font-size:1.05rem; color:var(--text); margin-bottom:0.25rem; letter-spacing:-0.02em; }
    .edu-degree { font-size:0.88rem; color:var(--muted); }
    .edu-courses { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:1rem; }
    .cert-pills { display:flex; flex-direction:column; gap:0.5rem; margin-top:0.9rem; }
    .cert-pill { display:inline-flex; align-items:center; gap:0.4rem; background:rgba(37,99,255,0.12); border:1px solid rgba(37,99,255,0.25); border-radius:50px; padding:0.35rem 0.9rem; font-family:var(--fm); font-size:0.67rem; color:var(--accent); }

    /* CONTACT */
    #contact { background:var(--bg2); }
    .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:6rem; }
    .contact-info p { color:var(--muted); margin-bottom:2rem; font-size:1rem; }
    .contact-list { display:flex; flex-direction:column; }
    .contact-row { display:flex; align-items:center; gap:1rem; font-size:0.88rem; color:var(--muted); text-decoration:none; padding:0.9rem 0; border-bottom:1px solid var(--border); transition:color 0.15s,padding-left 0.15s; }
    .contact-row:hover { color:var(--text); padding-left:0.35rem; }
    .contact-row-icon { width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:0.75rem; flex-shrink:0; color:var(--text); font-family:var(--fm); }
    .contact-form { display:flex; flex-direction:column; gap:1rem; }
    .form-group { display:flex; flex-direction:column; gap:0.4rem; }
    .form-label { font-family:var(--fm); font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
    .form-input,.form-textarea { background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1); border-radius:14px; padding:0.9rem 1.2rem; color:var(--text); font-family:var(--fb); font-size:0.95rem; outline:none; transition:border-color 0.15s,background 0.15s; width:100%; }
    .form-input:focus,.form-textarea:focus { border-color:var(--accent); background:rgba(255,255,255,0.08); }
    .form-textarea { height:140px; resize:vertical; }

    /* FOOTER */
    footer { background:#060e1a; color:rgba(248,245,239,0.4); padding:2rem 2.5rem; display:flex; align-items:center; justify-content:space-between; }
    .footer-copy { font-family:var(--fm); font-size:0.68rem; letter-spacing:0.04em; }
    .footer-back { font-family:var(--fm); font-size:0.68rem; color:rgba(248,245,239,0.4); text-decoration:none; transition:color 0.15s; }
    .footer-back:hover { color:var(--cream); }

    .travel-item { font-family:var(--fb); font-size:0.92rem; font-weight:500; color:rgba(248,245,239,0.7); padding:0.85rem 0; border-bottom:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; gap:0.6rem; transition:color 0.15s, padding-left 0.15s; cursor:default; }
    .travel-item:hover { color:var(--cream); padding-left:0.4rem; }

    /* PROJECT IMAGES */
    .proj-img { width:100%; height:160px; border-radius:12px; overflow:hidden; margin-bottom:1.25rem; background:rgba(255,255,255,0.04); flex-shrink:0; }
    .proj-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.3s ease; display:block; }
    .proj-card:hover .proj-img img { transform:scale(1.04); }
    .proj-img--placeholder { display:flex; align-items:center; justify-content:center; font-size:2rem; }

    /* LIVE DOT */
    .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#10b981; margin-left:0.5rem; vertical-align:middle; box-shadow:0 0 0 2px rgba(16,185,129,0.3); animation:livePulse 2s infinite; }
    @keyframes livePulse { 0%,100%{box-shadow:0 0 0 2px rgba(16,185,129,0.3)} 50%{box-shadow:0 0 0 5px rgba(16,185,129,0.08)} }

    /* TAPLY FEATURED */
    #taply-featured { background:linear-gradient(135deg,#0d1b33 0%,#0a1628 60%); border-top:1px solid rgba(37,99,255,0.18); border-bottom:1px solid rgba(37,99,255,0.18); padding:7rem 2.5rem; }
